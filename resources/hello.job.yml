# The hello-world job: one serverless notebook task that installs your arxiv_curator wheel,
# loads project_config.yml and writes one row to the hello table in your schema of the target's
# catalog (dev: llmops_dev.victor_bot_3).
# It runs as whoever deploys the bundle; the target's deploy principal does that from GitHub
# Actions. Its name ends with the target, so the three deployments never collide.
resources:
  jobs:
    hello:
      name: job-hello-victor-bot-3-${bundle.target}
      budget_policy_id: "4ef473b2-6356-384a-a608-e575713b3f9a"
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: hello
          environment_key: default
          notebook_task:
            notebook_path: deployment_notebooks/hello.py
            base_parameters:
              env: ${bundle.target}

      # CAN_MANAGE in dev, CAN_VIEW in acc and prd (databricks.yml, student_job_permission).
      permissions:
        - level: ${var.student_job_permission}
          user_name: "victor-bot-3@cauchy.io"
